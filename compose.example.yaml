services:
  dockfeed:
    image: ghcr.io/p6g9yhk6/dockfeed:latest
    container_name: dockfeed
    restart: unless-stopped
    ports:
      - 8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Keeps buffered summaries over restarts, needs DATA_DIR below.
      # - dockfeed-data:/data
    # DockFeed needs no capabilities and only writes to DATA_DIR when it's set.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      REFRESH_INTERVAL: 1h
      # EXCLUDE: '(?i)-rc|beta|alpha|nightly'
      # FEED_TYPE: summary
      # SUMMARY_PERIOD: 24h
      # DATA_DIR: /data

# volumes:
#   dockfeed-data:
